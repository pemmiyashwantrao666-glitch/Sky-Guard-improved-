name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skyguard-app/package-lock.json
      - name: Install dependencies
        working-directory: skyguard-app
        run: npm ci
      - name: Build
        working-directory: skyguard-app
        run: npm run build
        env:
          # GitHub Pages serves the app under a repo sub-path; keep asset URLs correct.
          # (Free Vercel *.vercel.app deploys need no env var — vite.config.ts defaults to "/")
          VITE_BASE_PATH: /Sky-Guard-improved-/
      # Pages has no SPA rewrites; serving index.html as 404.html makes
      # hard refreshes / direct links to sub-routes (e.g. /overview) work.
      - name: Create SPA fallback (404.html)
        working-directory: skyguard-app
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: skyguard-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
